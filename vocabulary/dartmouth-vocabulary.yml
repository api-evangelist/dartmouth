source: openapi/dartmouth-class-search-api-openapi.yml + live probes of courses.dartmouth.edu
x-operator: institution
vocabulary:
  name: Dartmouth Class Search Vocabulary
  description: >-
    Terms observed in the institution-operated Dartmouth Class Search service
    (courses.dartmouth.edu). Replaces an earlier vocabulary that described the
    ArcGIS Hub Search API — Esri's product, not Dartmouth's — which was removed
    from this repo on 2026-08-30.
  version: 2.0.0
  terms:
    - term: srcdb
      definition: >-
        Term code identifying an academic term, e.g. 202609 for fall 2026. An empty
        srcdb in a request selects the current term.
      tags: [ course-catalog, term ]
    - term: CRN
      definition: >-
        Course reference number. The stable identifier for one section of one course
        in one term; the key used by route=details.
      tags: [ course-catalog, identifier ]
    - term: code
      definition: Course code such as COSC 001 — subject abbreviation plus course number.
      tags: [ course-catalog ]
    - term: section
      definition: One scheduled offering of a course within a term, identified by CRN.
      tags: [ course-catalog ]
    - term: schd
      definition: Schedule type code for a section, e.g. L for lecture.
      tags: [ course-catalog, code-list ]
    - term: stat
      definition: Section status code — A for open, F for full.
      tags: [ course-catalog, code-list ]
    - term: meetingTimes
      definition: >-
        A JSON-encoded string holding meet_day / start_time / end_time records. It is a
        string inside JSON, not a nested object, and must be parsed a second time.
      tags: [ course-catalog, gotcha ]
    - term: fose
      definition: >-
        The course-search application convention Dartmouth Class Search implements, selected
        by the page=fose query parameter. Shared with several other US institutions, which is
        why the service shape is not Dartmouth-specific even though the deployment is.
      tags: [ course-catalog, convention ]
    - term: fatal
      definition: >-
        The member the service returns, inside an HTTP 200, when a request body cannot be
        parsed. The service's only error signal.
      tags: [ errors, gotcha ]
