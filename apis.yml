- aid: dartmouth:identity-federation
  name: Dartmouth Identity Federation (InCommon)
  x-operator: institution
  description: >-
    Dartmouth's SAML identity provider, registered in the InCommon federation under entityID
    urn:mace:incommon:dartmouth.edu and retrievable as machine-readable metadata over the
    InCommon MDQ protocol. The document declares SAML 1.1 and SAML 2.0 support, an
    AttributeAuthorityDescriptor, and SingleSignOnService endpoints on login2.dartmouth.edu.
    Institution-operated by definition and the one open machine-readable artifact Dartmouth
    itself publishes.
  x-operator-note: >-
    A host-based audit reads mdq.incommon.org as a shared vendor host because other institutions
    resolve there too. That verdict is wrong for this class: InCommon MDQ is a federation registry
    that serves each member its OWN metadata under its own entityID, and the document returned for
    urn:mace:incommon:dartmouth.edu is Dartmouth's, authored by Dartmouth, describing Dartmouth's
    IdP. Do not reclassify this as vendor and do not remove it.
  humanURL: https://incommon.org/federation/
