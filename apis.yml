description: >-
  Dartmouth College is a private Ivy League research university in Hanover, New Hampshire.
  Its programmable footprint is small, mostly gated, and largely operated by vendors on
  Dartmouth's behalf — the ordinary shape for a research university, which is a federation
  of buyers rather than an API producer. Exactly one institution-operated interface is open
  to the public without credentials: the JSON backend of Dartmouth Class Search
  (courses.dartmouth.edu), which returns the full timetable of class meetings keyless and
  which Dartmouth does not document as an API. Everything else Dartmouth itself runs is
  behind authentication: DartAPI at api.dartmouth.edu answers 401 on every resource path and
  issues JWTs only against a hand-issued API key tied to a Dartmouth Service Account, its
  developer portal at developer.dartmouth.edu redirects to Microsoft Entra SAML so not one
  reference page is readable from outside, and the Dartmouth Chat AI API requires a
  DARTMOUTH_API_KEY. The one genuinely open machine-readable artifact Dartmouth publishes is
  its SAML identity-federation metadata in InCommon. The research and data surfaces —
  Dartmouth Open Data on ArcGIS Hub, Dartmouth Digital Commons on bepress/Elsevier, Dartmouth
  Dataverse — are Dartmouth's data on someone else's contract and are recorded here as tenant
  relationships, not as Dartmouth engineering.
