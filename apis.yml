apis:
- aid: dartmouth:dartapi
  name: DartAPI Developer Portal
  description: >-
    DartAPI is Dartmouth's institutional API platform, documenting resource APIs such as the People API
    (directory information like name and email for Dartmouth identities) and a Nextgen API for student
    employee data. Access requires authentication to the DartAPI Login Service via a JWT bearer token
    obtained from a manually issued API key, and a Dartmouth Service Account requested through the Help
    Desk. Documentation pages sit behind Dartmouth CAS single sign-on.
  humanURL: https://developer.dartmouth.edu/
  tags:
  - Identity
  - Directory
  - People
  - Authentication
  - Gated
  properties:
  - type: Documentation
    url: https://developer.dartmouth.edu/
  - type: Authentication
    url: https://login.dartmouth.edu/cas/login
- aid: dartmouth:chat-ai
  name: Dartmouth Chat AI API
  description: >-
    An OpenAI-compatible REST API exposing large language models, embedding models, and reranking models
    deployed on Dartmouth's compute infrastructure as well as third-party cloud models made available
    by the institution. It is consumable via standard OpenAI clients and the official langchain_dartmouth
    Python package, and requires a DARTMOUTH_API_KEY obtained from the developer portal.
  humanURL: https://rc.dartmouth.edu/ai/online-resources/using-the-api/
  baseURL: https://chat.dartmouth.edu/api
  tags:
  - Artificial Intelligence
  - LLM
  - Embeddings
  - OpenAI Compatible
