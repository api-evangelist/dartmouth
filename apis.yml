x-coverage:
  state: gated
  reason: auth_required
  detail: >-
    Dartmouth operates real APIs and almost all of them are closed. developer.dartmouth.edu,
    including every /docs/ page, 302s to Microsoft Entra SAML, so DartAPI's endpoint inventory
    cannot be read from outside the institution and none is asserted here. api.dartmouth.edu
    answers 401 on every resource path and chat.dartmouth.edu/api answers 401 without a
    DARTMOUTH_API_KEY — both live, both credentialed, neither describable. What could be
    captured was captured: the keyless Dartmouth Class Search backend, described from live
    probes into a full artifact set, and Dartmouth's InCommon SAML metadata. The research and
    data surfaces are tenant deployments whose contracts belong to Esri, bepress/Elsevier and
    the Dataverse project. Seven ArcGIS Hub Search OpenAPIs plus 26 files derived from them
    were removed from this repo on 2026-08-30; they described Esri's product, were re-based
    onto chat.dartmouth.edu, and their sample data was a StoryMap about a park in Panama City.
  evidence:
    - url: https://courses.dartmouth.edu/api/?page=fose&route=search
      status: 200
    - url: https://api.dartmouth.edu/api/people/
      status: 401
    - url: https://api.dartmouth.edu/api/jwt
      status: 405
    - url: https://chat.dartmouth.edu/api/models
      status: 401
    - url: https://developer.dartmouth.edu/docs/100_basic/010_introduction.md
      status: 302
    - url: https://mdq.incommon.org/entities/urn%3Amace%3Aincommon%3Adartmouth.edu
      status: 200
    - url: https://digitalcommons.dartmouth.edu/do/oai/?verb=Identify
      status: 200
    - url: https://dataverse.dartmouth.edu/api/info/version
      status: 200
    - url: https://dataverse.dartmouth.edu/oai?verb=Identify
      status: 503
    - url: https://chat.dartmouth.edu/openapi.json
      status: 200
      note: soft 404 — returns the Open WebUI SPA shell as text/html, not a specification
